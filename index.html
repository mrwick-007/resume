.pop{position:fixed;pointer-events:none;z-index:50;font-size:22px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
.ring.big{width:120px;height:120px;font-size:20px}.rg:has(.big){width:120px}
.yr{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}.sems{display:flex;gap:18px;flex-wrap:wrap}

#gov,#ret{position:fixed;inset:0;z-index:55;display:grid;place-items:center;background:#0009;padding:12px}
.gbox{background:var(--bg);border:3px solid var(--ink);border-radius:var(--r);padding:26px;max-width:min(480px,94vw);box-shadow:8px 8px 0 var(--a);text-align:center}
.gbox p{font:700 clamp(20px,4vw,28px)/1.2 var(--dp);margin-bottom:18px}.gb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#red{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;text-align:center;font:900 clamp(40px,10vw,120px)/1 var(--dp);color:#fff;text-shadow:0 0 30px #f00;animation:fl .5s steps(2) infinite}

#bins span{position:fixed;bottom:6px;z-index:65;font-size:42px}#bins span:nth-child(1){left:12px}#bins span:nth-child(2){left:50%}#bins span:nth-child(3){right:12px}
.x-bin{animation:bin 1s ease-in forwards}@keyframes bin{to{transform:translate(var(--tx),var(--ty)) rotate(200deg) scale(.03);opacity:0}}
.x-shred{-webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);animation:shr 1s ease-in forwards}@keyframes shr{to{transform:translateY(60vh) scaleY(.2);opacity:0}}
.x-erase{animation:ers .9s ease-in forwards}@keyframes ers{from{clip-path:inset(0)}to{clip-path:inset(0 0 0 100%);filter:blur(6px);opacity:0}}
.gone{visibility:hidden!important}
.bot{position:fixed;z-index:70;font-size:28px;pointer-events:none;animation:hop .8s ease-in-out forwards}@keyframes hop{0%{transform:translateX(-50px)}40%{transform:translate(0,-14px)}70%{transform:none}100%{transform:translateX(30px);opacity:0}}
</style>
</head>

if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";
/* animated tab title + favicon */
const TT=["Darshan ✨","law + code 💻","hire me? 👀","slay mode: on 💅"],FE=["✨","⚖️","💻","🫶","🔥","👀"];let ti=0;
const fav=document.createElement("link");fav.rel="icon";document.head.appendChild(fav);
const cv=document.createElement("canvas");cv.width=cv.height=64;const cx=cv.getContext("2d");
setInterval(()=>{ti++;document.title=document.hidden?"come back 🥺":TT[(ti>>1)%TT.length];
 cx.clearRect(0,0,64,64);cx.font="48px serif";cx.textAlign="center";cx.textBaseline="middle";cx.save();cx.translate(32,34);const k=1+.18*Math.sin(ti);cx.scale(k,k);cx.fillText(FE[ti%FE.length],0,0);cx.restore();fav.href=cv.toDataURL()},900);
/* discord copy */
$("#dc").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(D.contact.discord);toast("Discord copied: "+D.contact.discord)};
/* "are you the government" bit */
let govSeen=false,ac,osc;
function siren(on){if(on){try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();const g=ac.createGain();osc.type="sawtooth";g.gain.value=.12;osc.connect(g);g.connect(ac.destination);osc.start();const t=ac.currentTime;for(let i=0;i<20;i++){osc.frequency.setValueAtTime(420,t+i*1.1);osc.frequency.exponentialRampToValueAtTime(900,t+i*1.1+.9)}}catch(e){}}else{try{osc&&osc.stop();ac&&ac.close()}catch(e){}osc=null}}
function ask(n){$("#gov").hidden=false;$("#gq").textContent=n===1?"Just checking… are YOU the government??":"ARE YOU SURE???";
 $("#gb").innerHTML=n===1?'<button class="btn pri" data-g="p">Yes</button><button class="btn" data-g="n">No</button>':'<button class="btn pri" data-g="p">Yes, I’m the government</button><button class="btn pri" data-g="p">No, I’m not sure!</button>';$("#gb button").focus()}
function purge(){govSeen=true;$("#gov").hidden=true;$("#red").hidden=false;$("#bins").hidden=false;siren(true);
 const q=[...document.querySelectorAll("nav,.hello,h1,.lead,header .cta,h2,.card,.slot,.grp .chip,#cnt,footer")];
 const V=new Map(q.map(e=>{const r=e.getBoundingClientRect();return[e,r.bottom>0&&r.top<innerHeight]}));
 const o=[...q.filter(e=>V.get(e)),...q.filter(e=>!V.get(e))];let t=0;
 o.forEach((e,i)=>{const v=V.get(e);t+=v?170:35;const k=["bin","shred","erase"][i%3];
  setTimeout(()=>{const r=e.getBoundingClientRect(),bx=[40,innerWidth/2,innerWidth-40][i%3];
   e.style.setProperty("--tx",(bx-(r.left+r.width/2))+"px");e.style.setProperty("--ty",(innerHeight-40-(r.top+r.height/2))+"px");e.classList.add("x-"+k);
   if(v){const b=document.createElement("span");b.className="bot";b.textContent="🕴️";b.style.left=Math.max(4,r.left-10)+"px";b.style.top=Math.min(innerHeight-40,Math.max(4,r.top))+"px";document.body.appendChild(b);setTimeout(()=>b.remove(),850)}
   setTimeout(()=>e.classList.add("gone"),1000)},t)});
 setTimeout(()=>{siren(false);$("#red").hidden=true;$("#ret").hidden=false;$("#retry").focus()},t+1300)}
document.addEventListener("click",e=>{const g=e.target.closest("[data-g]");
 if(g){g.dataset.g==="p"?purge():ask(2)}
 if(e.target.closest("#gv")){e.preventDefault();purge()}
 if(e.target.closest("#retry")){document.querySelectorAll(".x-bin,.x-shred,.x-erase,.gone").forEach(x=>x.classList.remove("x-bin","x-shred","x-erase","gone"));$("#ret").hidden=true;$("#bins").hidden=true;scrollTo(0,0)}});
setTimeout(()=>{if(!govSeen){govSeen=true;ask(1)}},5500);
</script>
